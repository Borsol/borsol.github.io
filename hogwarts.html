<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bewerberportal | Zaubereiakademie</title>
  <style>
    /* --- MODERNES & MAGISCHES DESIGN (CSS) --- */
    :root {
      --blue: #172536; /* Blau */
      --gold: #C6A34A; /* Gold */
      --red: #7A263A; /*Rot*/
      --green: #176B52;/*Grün*/
      --text-color: #333;
      --bg-color: #f7f5fa;
      --card-bg: #ffffff;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
    }

    header {
      background-color: var(--blue);
      color: white;
      text-align: center;
      padding: 3rem 1rem;
      border-bottom: 4px solid var(--gold);
    }

    header h1 {
      margin: 0;
      font-size: 2.5rem;
      letter-spacing: 1px;
    }

    header p {
      margin: 0.5rem 0 0 0;
      color: var(--gold);
      font-style: italic;
      font-size: 1.2rem;
    }

    main {
      max-width: 1200px;
      margin: 3rem auto;
      padding: 0 1rem;
    }

    /* Grid-Layout für die modernen Cards */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 2rem;
    }

    /* Card-Styling */
    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      padding: 1.5rem;
      border-top: 5px solid var(--gold);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(44, 26, 77, 0.15);
    }

    .card h3 {
      margin-top: 0;
      color: var(--blue);
      font-size: 1.4rem;
    }

    .card .location {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #666;
      margin-bottom: 1rem;
    }

    .card .publishToDate {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #666;
      margin-bottom: 1rem;
    }

    .card .shortName {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #555;
      flex-grow: 1; /* Drückt den Button nach unten */
      margin-bottom: 1.5rem;
    }

    .btn-bewerben {
      display: inline-block;
      text-align: center;
      background-color: var(--gold);
      color: var(--blue);
      text-decoration: none;
      font-weight: bold;
      padding: 0.75rem;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .btn-bewerben:hover {
      background-color: var(--red);
      color: white;
    }

    .card:has(.btn-bewerben:hover){
      border-top-color: var(--red);
    }

    .error-msg {
      color: #721c24;
      background-color: #f8d7da;
      padding: 1rem;
      border-radius: 6px;
      grid-column: 1 / -1;
      text-align: center;
    }

    .initiativ{
      margin-top:2rem;
  
      background:var(--blue);
      color:white;
  
      padding:1.25rem 1.5rem;
      border-radius:12px;
    }

    a.initiativ {
    display: block;
    background: var(--bg-color);
    width: 20%;
    color: var(--gold);
    text-decoration: none;
    padding: 20px 24px;
    margin-top: 25px;
    border-radius: 12px;
    border: 2px solid var(--gold);
    font-size: 1.1rem;
    font-weight: 700;
      
    }
    
    a.initiativ:hover {
      border: 2px solid var(--red);
      transition: border 0.2s;
      box-shadow: 0 8px 25px rgba(44, 26, 77, 0.15);
      color: var(--red);
    }

    
  </style>
</head>
<body>

  <header>
    <h1>Akademie für Zauberei</h1>
    <p>Gestalten Sie die magische Zukunft der nächsten Generation</p>
  </header>

  <main>
    <h2>Aktuelle Stellenausschreibungen</h2>
    
    <!-- Hier fügt das JavaScript die XML-Daten als Cards ein -->
    <div id="ausschreibungen-container" class="grid-container">
      <p>Die magischen Ausschreibungen werden geladen...</p>
    </div>

    <div>
      <p class="initiativ">Keine passende Veröffentlichung gefunden? Schau doch spontan mit deinem Besen vorbei!</p>
      <a class="initiativ" href="https://hannit.pi-asp.de/bewerber-web/?companyEid=0001&tenant=27700&lang=D&canShare=true&Uid=FC7584FC331BDD9B674EEB07611A4FDC#position,id=d33fb936-94c6-499a-8a7c-9f6acdfbdbf0">Zur Initiativbewerbung</a>
    </div>

  </main>

  <!-- --- FUNKTIONALITÄT (JAVASCRIPT) --- -->
  <script>
    // Funktion zum Laden und Parsen der XML
    fetch('jobs.xml')
      .then(response => {
        if (!response.ok) {
          throw new Error('Der Zaubereikristall muss neu aufgeladen werden.');
        }
        return response.text();
      })
      .then(xmlString => {
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlString, "application/xml");
        const container = document.getElementById('ausschreibungen-container');
        container.innerHTML = ''; // Lade-Text entfernen

        // Alle <job>-Elemente aus der XML holen
        const jobs = xmlDoc.getElementsByTagName('job');

        if(jobs.length === 0) {
          container.innerHTML = '<p>Aktuell sind keine Stellen offen.</p>';
          return;
        }

        // Schleife durch alle Jobs
        for (let i = 0; i < jobs.length; i++) {
          const title = jobs[i].getElementsByTagName('title')[0]?.textContent || 'Kein Titel';
          const location = jobs[i].getElementsByTagName('location')[0]?.textContent || 'Hauptstandort';
          const shortName = jobs[i].getElementsByTagName('shortName')[0]?.textContent || '';
          const url = jobs[i].getElementsByTagName('url')[0]?.textContent || '';

          //Datum umwandeln          
          const publishedToDate = new Intl.DateTimeFormat('de-DE', {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric'
          }).format(new Date((jobs[i].getElementsByTagName('publishToDate')[0]?.textContent).replace(/\./g, '-')));

          // HTML für eine einzelne Card erstellen
          const card = document.createElement('div');
          card.className = 'card';

          card.innerHTML = `
            <h3>${title}</h3>
            <div class="location">Standort: ${location}</div>
            <p class="publishToDate">Veröffentlicht bis: ${publishedToDate}</p>
            <p class="shortName">${shortName}</p>
            <a href="${url}" class="btn-bewerben">Jetzt bewerben</a>
          `;

          // Card dem Grid hinzufügen
          container.appendChild(card);
        }
      })
      .catch(error => {
        console.error('Fehler:', error);
        document.getElementById('ausschreibungen-container').innerHTML = `
          <div class="error-msg">
            Die Stellenausschreibungen konnten nicht geladen werden. (Fehler: XML fehlt oder CORS-Problem)
          </div>
        `;
      });
  </script>
</body>
</html>
